spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/library_management_system
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  error:
    include-message:

jwt_secret: ${JWT_SECRET}
allowed_origin: ${ALLOWED_ORIGIN:http://localhost:3000}
